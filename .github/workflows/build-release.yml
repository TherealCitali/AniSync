name: Build Signed Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.13

      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > ./app/release.keystore
          elif [ -f ./keystore/anisync-release.p12 ]; then
            echo "Using repository release keystore"
            cp ./keystore/anisync-release.p12 ./app/release.keystore
          else
            echo "No keystore available" >&2
            exit 1
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease

      - name: Resolve APK file names
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/stable/release"

          arm64_file="$(basename "$(ls "$apk_dir"/*-arm64-v8a-release.apk)")"
          armeabi_file="$(basename "$(ls "$apk_dir"/*-armeabi-v7a-release.apk)")"
          universal_file="$(basename "$(ls "$apk_dir"/*-universal-release.apk)")"
          x86_64_file="$(basename "$(ls "$apk_dir"/*-x86_64-release.apk)")"
          x86_file="$(basename "$(ls "$apk_dir"/*-x86-release.apk)")"

          {
            echo "APK_ARM64_FILE=$arm64_file"
            echo "APK_ARMEABI_FILE=$armeabi_file"
            echo "APK_UNIVERSAL_FILE=$universal_file"
            echo "APK_X86_64_FILE=$x86_64_file"
            echo "APK_X86_FILE=$x86_file"
          } >> "$GITHUB_ENV"

      - name: Upload arm64-v8a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-arm64-v8a
          path: app/build/outputs/apk/stable/release/${{ env.APK_ARM64_FILE }}

      - name: Upload armeabi-v7a Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-armeabi-v7a
          path: app/build/outputs/apk/stable/release/${{ env.APK_ARMEABI_FILE }}

      - name: Upload universal Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-universal
          path: app/build/outputs/apk/stable/release/${{ env.APK_UNIVERSAL_FILE }}

      - name: Upload x86_64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-x86_64
          path: app/build/outputs/apk/stable/release/${{ env.APK_X86_64_FILE }}

      - name: Upload x86 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-x86
          path: app/build/outputs/apk/stable/release/${{ env.APK_X86_FILE }}

      - name: Upload All Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-all
          path: app/build/outputs/apk/stable/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/stable/release/*.apk
          token: ${{ secrets.MY_PAT_TOKEN }}
